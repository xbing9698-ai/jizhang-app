name: apply-finance-upgrade

on:
  push:
    branches: [feature/finance-ui-editing-20261017]
    paths:
      - scripts/apply-finance-upgrade.mjs
      - scripts/fix-finance-upgrade.mjs
      - .github/workflows/apply-finance-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-ui-editing-20261017
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: 应用需求补丁
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-finance-upgrade.mjs')
          s=p.read_text()
          s=s.replace("replaceRegex('js/app.js', /const adjustmentDialog = document\\.getElementById\\('adjustmentDialog'\\);[\\s\\S]*?\\nfunction renderMerchantView\\(rows\\) \\{/, adjustmentBlock + '\\nfunction renderMerchantView(rows) {', 'transactionEditForm').catch?.(() => {});", "replaceRegex('js/app.js', /const adjustmentDialog = document\\.getElementById\\('adjustmentDialog'\\);[\\s\\S]*?\\nfunction renderMerchantView\\(rows\\) \\{/, adjustmentBlock + '\\nfunction renderMerchantView(rows) {', 'transactionEditForm');")
          p.write_text(s)
          PY
          node --check scripts/apply-finance-upgrade.mjs
          node scripts/apply-finance-upgrade.mjs
          node --check scripts/fix-finance-upgrade.mjs
          node scripts/fix-finance-upgrade.mjs
      - name: 安装依赖并运行完整测试
        run: |
          npm ci
          npm test
      - name: 提交实现
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html css/style.css js tests sw.js scripts/apply-finance-upgrade.mjs scripts/fix-finance-upgrade.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement finance UI and transaction editing upgrade"
          git push origin HEAD:feature/finance-ui-editing-20261017
